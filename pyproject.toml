[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "after-scope"
version = "0.1.0"
description = "End-of-session compliance & metadata tool for a shared Zeiss microscope (ZEN Blue)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = [
    "PySide6>=6.8",
    "psutil>=6.1",
    "PyYAML>=6.0.2",
    "pydantic>=2.8",
    "jinja2>=3.1",
    "pystray>=0.19 ; sys_platform == 'win32'",
    "pillow>=10.0",
    "pylibCZIrw>=6.0",
    "czifile>=2019.7.2",
    "tifffile>=2024.1.30",
    "numpy>=1.26",
    "pywin32>=308 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
# On macOS dev machines pylibCZIrw may lack wheels; czifile is the fallback reader.
czi = ["pylibCZIrw>=4.1"]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]
build = ["pyinstaller>=6.11"]

[project.scripts]
after-scope = "after_scope.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/after_scope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
